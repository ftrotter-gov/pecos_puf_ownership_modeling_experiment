###############################################################################
# RULE 3: corporate_families -- different legal names, one corporate group
#
# This is the hard case, and the only rule here that is NOT derivable from the
# strings. HCA INC, HEALTHTRUST INC, HERCULES HOLDING II and FRISCO HOLDING II
# share no words, yet are one group: PECOS records a hospital's direct (34)
# and indirect (35) parties as a FLAT LIST, so several levels of one corporate
# hierarchy arrive as siblings on the same hospital.
#
# WHY THESE ARE LISTED BY HAND
#
# Automatic co-ownership clustering was implemented, measured, and REJECTED.
# Clustering owners that share >=95% of their hospitals and taking connected
# components over-merges badly, because genuine joint ventures chain unrelated
# companies together: if A and B co-own one hospital and B and C co-own
# another, connected components merge A with C.
#
#   threshold >=2 shared  -> one 113-member cluster fusing Tenet, LifePoint,
#                            CommonSpirit, CHI Nebraska, Texas Health
#                            Resources and St. Luke's into a single "company"
#   threshold >=10 shared -> cleaner, but STILL merges VANGUARD GROUP,
#                            BLACKROCK and INVESCO into Encompass Health, and
#                            MORGAN STANLEY into Tenet
#
# Index funds hold small stakes in every public hospital chain, so overlap
# alone cannot distinguish "is owned by" from "holds shares in". Only the
# families below are merged, each reviewed against its overlap evidence.
#
# Members were taken from the >=10-shared clustering and then PRUNED BY HAND to
# drop institutional investors. The passive_investors list further down marks
# those separately rather than merging them anywhere.
###############################################################################
corporate_families:
  - family: HCA Healthcare
    keep: "0446167381"
    keep_name: "HCA HEALTHCARE INC"
    merge:
      - "1052593506"   # HCA HEALTHCARE INC (duplicate enrollment)
      - "6305755471"   # HEALTHTRUST INC - THE HOSPITAL COMPANY
      - "3971608001"   # HERCULES HOLDING II
      - "1456827369"   # FRISCO HOLDING II
      - "8325143456"   # FRISCO HOLDING II (duplicate enrollment)
      - "7113364175"   # HERCULES HOLDING II (duplicate enrollment)
      - "0143493833"   # HCA SQUARED LLC
      - "7012826068"   # HOSPITAL CORP LLC
      - "9032028105"   # HTI HOSPITAL HOLDINGS INC
      - "9335058601"   # HEALTHSERV ACQUISITION LLC
      - "6406740554"   # GALEN HOLDCO LLC
      - "6204812936"   # HCA HEALTH SERVICES OF TEXAS INC
    reason: >-
      One corporate family. Every member shares at least 10 hospitals with
      another member at >=95% overlap of the smaller set; HCA HEALTHCARE INC
      and HERCULES HOLDING II overlap at 100%. Hercules and Frisco Holding are
      the private-equity holding vehicles from the 2006 HCA buyout, HealthTrust
      and Galen are historical HCA entities. Union of provider organizations
      across the family is 117, against 115 for HCA INC alone -- confirming
      these are levels of one hierarchy, not separate owners.

  - family: LifePoint Health
    keep: "4880725506"
    keep_name: "LIFEPOINT HEALTH INC"
    merge:
      - "3072815117"   # DSB ACQUISITION LLC
      - "9931592938"   # LIFEPOINT REHAB BLOCKER PARENT LLC
      - "2668865668"   # LIFEPOINT REHAB LLC
      - "0840683843"   # LIFEPOINT REHAB BLOCKER LLC
      - "8921040940"   # LEGACY LIFEPOINT HEALTH LLC
