###############################################################################
# RULE 4: passive_investors -- flagged, never merged
#
# These hold small indirect (role 35) stakes in publicly traded hospital
# chains: index funds and asset managers. They are correctly disclosed to CMS,
# but presenting them beside HCA as "ultimate owners" misstates who controls a
# hospital. Vanguard and BlackRock previously ranked #2 and #5 in the report.
#
# The patch does NOT merge or delete them -- deleting disclosed ownership would
# be falsifying the data. The applier records them so the report can label and
# optionally exclude them, with the raw rows left intact.
###############################################################################
passive_investors:
  - owner_name: "VANGUARD GROUP INC"
    reason: >-
      Index fund holding 5-10% indirect (role 35) positions across publicly
      traded chains. NOT "VANGUARD HEALTH SYSTEMS", a Tenet subsidiary.
  - owner_name: "BLACKROCK INC"
    reason: Index fund; 5-10% indirect positions in public hospital chains.
  - owner_name: "INVESCO LTD"
    reason: Asset manager; small indirect positions in public hospital chains.
  - owner_name: "MORGAN STANLEY DEAN WITTER CAPITAL"
    reason: Financial investor, not a hospital operator.
