###############################################################################
# owner_name_patch.yaml -- corrections applied to the CMS Hospital All Owners
# public-use file before the ETL runs.
#
# Spec:   AI_Instructions/EntityResolutionProblem.md
# Applied by: apply_data_patch.py
# Target: data/Hospital_All_Owners_2026.07.31_update.csv
#
# THIS FILE IS THE SINGLE PLACE FOR DATA-CONTENT CORRECTIONS.
#
# CMS publishes PECOS as-reported and does no entity resolution, so the same
# company appears under several spellings and several enrollment IDs. That is
# a property of the data, not a bug in the pipeline, so it is corrected here
# -- declaratively, with a reason on every rule -- rather than inside the ETL
# where the decisions would be invisible.
#
# RULES OF THE ROAD
#
#   1. The original CSV is never modified. The patched copy is generated.
#   2. Every rule states a `reason`. No reason, no merge.
#   3. Conservative beats clever. A wrong merge invents a corporate
#      relationship that does not exist, which is worse than two split records.
#   4. Corporate form is MEANINGFUL. "ACME INC" and "ACME LLC" are different
#      legal entities and are NEVER merged by the punctuation rules below.
#
# Vintage: 2026.07.31. Owner IDs are specific to this snapshot and must be
# re-derived if the snapshot changes -- see patched_data/README.md.
###############################################################################

meta:
  target_file: Hospital_All_Owners_2026.07.31_update.csv
  output_suffix: .patched
  snapshot: "2026.07.31"
  # Columns the patch is allowed to touch. Anything else is passed through
  # byte-for-byte, so the patch can never silently alter ownership facts.
  owner_id_column: "ASSOCIATE ID - OWNER"
  owner_name_column: "ORGANIZATION NAME - OWNER"

###############################################################################
# RULE 1: canonical_names -- spelling variants of one name
#
# Differences in punctuation, hyphenation, spacing, or a leading "THE" only.
# Corporate form (INC / LLC / CORP / LP) is deliberately PRESERVED: merging
# "TRIAD HEALTHCARE CORPORATION" with "TRIAD HEALTHCARE LLC" would assert that
# two distinct legal entities are one, which this patch will not do.
#
# 30 groups, absorbing 31 variant spellings. Generated by comparing names
# under a punctuation-only normalization, then reviewed.
###############################################################################
canonical_names:
  - canonical: "ADVOCATE HEALTH, INC."
    variants:
      - "ADVOCATE HEALTH INC"
    reason: Same entity; differs only in punctuation or a leading article.
  - canonical: "AMG 2.0, LLC"
