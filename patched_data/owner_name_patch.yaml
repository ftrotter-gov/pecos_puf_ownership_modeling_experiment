# This is the safest rule in the file: it asserts nothing beyond what CMS
# already states, since the names are already identical. It is what collapses
# the duplicate HERCULES HOLDING II / FRISCO HOLDING II / VANGUARD GROUP INC
# entries that previously appeared twice in the report.
#
# 71 groups, merging away 84 duplicate IDs.
###############################################################################
